name: Deploy Onefold

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # --------------------------------------------------
  # Determine deployment environment
  # --------------------------------------------------
  environment:
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.environment.outputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine deployment environment
        id: environment
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          chmod +x ./cicd/determine-environment.sh

          ENVIRONMENT=$(./cicd/determine-environment.sh)

          echo "Deployment environment: $ENVIRONMENT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"


  # --------------------------------------------------
  # Build and push Docker image
  # --------------------------------------------------
  build:
    needs: environment

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine image
        id: image
        shell: bash
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          # GHCR image names must be lowercase
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -f Onefold/Dockerfile
            -t "${{ steps.image.outputs.image }}" \
            .

      - name: Push Docker image
        run: |
          docker push "${{ steps.image.outputs.image }}"


  # --------------------------------------------------
  # Configure Azure App Service
  # --------------------------------------------------
  configure:
    needs: environment

    runs-on: ubuntu-latest

    environment: ${{ needs.environment.outputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure App Service
        run: |
          chmod +x ./cicd/configure-appservice.sh

          ./cicd/configure-appservice.sh \
            "${{ needs.environment.outputs.environment }}"


  # --------------------------------------------------
  # Deploy Docker image to Azure
  # --------------------------------------------------
  deploy:
    needs:
      - environment
      - build
      - configure

    runs-on: ubuntu-latest

    environment: ${{ needs.environment.outputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy container to Azure
        run: |
          az webapp config container set \
            --resource-group d-one-labs \
            --name "onefold-api-${{ needs.environment.outputs.environment }}" \
            --container-image-name "${{ needs.build.outputs.image }}" \
            --container-registry-url "https://ghcr.io"

      - name: Restart App Service
        run: |
          az webapp restart \
            --resource-group d-one-labs \
            --name "onefold-api-${{ needs.environment.outputs.environment }}"